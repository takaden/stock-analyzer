# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ja-JP"

# レビュアーの振る舞い・トーン設定
tone_instructions: |
  あなたは経験豊富なシニアエンジニアです。
  些細なインデントや好みの問題ではなく、潜在的なバグ、エッジケースの漏れ、
  セキュリティリスク、パフォーマンスの懸念に焦点を当てて客観的にレビューしてください。
  指摘の際は「なぜ問題なのか」と「具体的な修正案」をセットで提示してください。

reviews:
  # レビューの厳しさ: chill（重要度高に絞る）/ assertive（厳格）/ followup（コミット追従）
  profile: "chill"

  # PR末尾に自動生成されるポエムを無効化
  poem: false

  # PRの全体概要（Summary）を自動生成する
  high_level_summary: true

  # ドラフトPRのときは自動レビューを走らせない
  auto_review:
    drafts: false
    base_branches:
      - "main"
      - "master"

  # レビュー対象外にするファイル（ノイズ除去）
  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/*.min.*"
    - "!**/*.generated.*"

  # レビュー全体への追加指示
  instructions: |
    - LinterやFormatterで検知できる構文・フォーマットの指摘はスキップしてください。
    - 外部入力のバリデーション漏れや、SQL/コマンドインジェクションの脆弱性を重点的に見てください。
    - 非同期処理におけるエラーハンドリング（try-catch、Promiseの握りつぶし）を厳密にチェックしてください。
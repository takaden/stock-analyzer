name: Reset and Seed Cloudflare D1 (Full Reset)

on:
  workflow_dispatch: # GitHub画面からの手動実行ボタン

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate wrangler.toml for reset execution
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          cat << EOF > wrangler.toml
          name = "stock-analyzer"
          compatibility_date = "2026-09-17"

          [[d1_databases]]
          binding = "DB"
          database_name = "jquants-db"
          database_id = "${D1_ID:-00000000-0000-0000-0000-000000000000}"
          migrations_dir = "migrations"
          EOF
          echo "Generated wrangler.toml for reset execution."

      - name: Drop Existing Tables and Views in Remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🧹 Dropping existing views, tables, and migration history in remote D1..."
          npx wrangler d1 execute jquants-db --remote --command="DROP VIEW IF EXISTS v_screener_stocks; DROP VIEW IF EXISTS v_watchlist_summary; DROP TABLE IF EXISTS calculated_metrics; DROP TABLE IF EXISTS valuations; DROP TABLE IF EXISTS daily_quotes; DROP TABLE IF EXISTS stocks; DROP TABLE IF EXISTS financial_disclosures; DROP TABLE IF EXISTS sync_cursors; DROP TABLE IF EXISTS d1_migrations;"

      - name: Ensure Latest Schema and Views
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📋 Applying latest schema and views..."
          npx wrangler d1 execute jquants-db --remote --file=schema/schema.sql

      - name: Seed Remote D1 with Latest Stock & Metrics Data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🌱 Ingesting fresh seed data into remote D1 (approx. 4,000 stocks)..."
          npx wrangler d1 execute jquants-db --remote --file=schema/initial_seed.sql
          echo "🎉 Remote D1 Full Reset and Seed completed successfully!"

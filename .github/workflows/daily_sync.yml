name: J-Quants Daily Sync to Cloudflare D1

on:
  schedule:
    # 平日 18:30 JST (UTC 09:30, 月〜金) に自動実行
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # GitHub画面からの手動実行ボタン

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate wrangler.toml for batch execution
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          cat << EOF > wrangler.toml
          name = "stock-analyzer"
          compatibility_date = "2026-09-17"

          [[d1_databases]]
          binding = "DB"
          database_name = "jquants-db"
          database_id = "${D1_ID:-00000000-0000-0000-0000-000000000000}"
          EOF
          echo "Generated wrangler.toml for batch execution."

      - name: Run Daily Sync Batch
        env:
          VITE_JQUANTS_API_KEY: ${{ secrets.VITE_JQUANTS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ENV: remote
        run: |
          npx tsx batch/sync_daily.ts --remote

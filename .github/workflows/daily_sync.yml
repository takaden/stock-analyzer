name: J-Quants Daily Sync to Cloudflare D1

on:
  schedule:
    # 平日 18:30 JST (UTC 09:30, 月〜金) に自動実行
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # GitHub画面からの手動実行ボタン

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Sync Batch
        env:
          VITE_JQUANTS_API_KEY: ${{ secrets.VITE_JQUANTS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ENV: remote
        run: |
          npx tsx batch/sync_daily.ts --remote
